name: Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit on main where the version first appeared
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      release-sha: ${{ steps.version.outputs.release-sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Detect project version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit ${release_commit} is not on main." >&2
            exit 1
          fi

          current_version="$(
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          previous_version=""
          comparison_sha="${BEFORE_SHA}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            comparison_sha="${release_commit}^"
          fi
          if git cat-file -e "${comparison_sha}:pyproject.toml" 2>/dev/null; then
            previous_version="$(
              git show "${comparison_sha}:pyproject.toml" |
                python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'
            )"
          fi

          echo "release-sha=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${current_version}" == "${previous_version}" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Version ${current_version} did not first appear in ${release_commit}." >&2
              exit 1
            fi
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build and validate
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.detect-version.outputs.release-sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check --output-format github
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build
      - name: Smoke test the minimal wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --isolated --no-project --python 3.14 \
            --with "${wheel}" python tests/smoke_minimal_install.py
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  tag:
    name: Tag release
    needs: [detect-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the verified release tag.
    steps:
      # The tag job intentionally retains credentials for its single authenticated push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] required for the tag push below
          fetch-depth: 0
          ref: ${{ needs.detect-version.outputs.release-sha }}
      - name: Tag version commit
        env:
          RELEASE_SHA: ${{ needs.detect-version.outputs.release-sha }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${tag}")"
            if [[ "${tagged_commit}" != "${RELEASE_SHA}" ]]; then
              echo "Tag ${tag} already points to ${tagged_commit}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag}" --message "Release ${RELEASE_VERSION}" "${RELEASE_SHA}"
            git push origin "refs/tags/${tag}"
          fi

  publish:
    name: Publish to PyPI
    needs: [detect-version, tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cli-consumption
    permissions:
      id-token: write # Required for PyPI trusted publishing.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
