name: cli-consumption

services:
  postgres:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    restart: unless-stopped
    environment:
      POSTGRES_DB: cli_consumption
      POSTGRES_USER: cli_consumption
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the local .env}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cli_consumption -d cli_consumption"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 128mb
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  collector:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      CLI_CONSUMPTION_API_TOKEN: ${CLI_CONSUMPTION_API_TOKEN:?set CLI_CONSUMPTION_API_TOKEN in the local .env}
      CLI_CONSUMPTION_DATABASE: postgresql+psycopg://cli_consumption:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the local .env}@postgres:5432/cli_consumption
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      COLLECTOR_DOMAIN: ${COLLECTOR_DOMAIN:?set COLLECTOR_DOMAIN in the local .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the local .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      collector:
        condition: service_healthy
    pids_limit: 100
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
