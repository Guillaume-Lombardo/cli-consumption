[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-consumption"
version = "0.3.1"
description = "Analyze and consolidate AI coding CLI consumption across machines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Guillaume Lombardo", email = "lombardo.guillaume@gmail.com" }]
keywords = ["ai", "cli", "codex", "observability", "tokens", "usage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "alembic>=1.14",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "typer>=0.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
server = ["fastapi>=0.115", "uvicorn>=0.34"]
sync = ["httpx>=0.27"]
snapshots = [
    "cryptography>=45",
]

[project.urls]
Homepage = "https://github.com/Guillaume-Lombardo/cli-consumption"
Documentation = "https://github.com/Guillaume-Lombardo/cli-consumption#readme"
Changelog = "https://github.com/Guillaume-Lombardo/cli-consumption/blob/main/CHANGELOG.md"
Issues = "https://github.com/Guillaume-Lombardo/cli-consumption/issues"
Repository = "https://github.com/Guillaume-Lombardo/cli-consumption.git"

[project.scripts]
cli-consumption = "cli_consumption.cli:app"

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "hypothesis>=6.165.10",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.2",
  "psycopg[binary]>=3.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "ty>=0.0.74",
  "uvicorn>=0.34",
  "zizmor>=1.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_consumption"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/README.md",
  "/pyproject.toml",
  "/src/cli_consumption",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cli_consumption"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"src/cli_consumption/adapters/_shared.py" = ["S608"]
"src/cli_consumption/adapters/cline.py" = ["S608"]
"src/cli_consumption/adapters/crush.py" = ["S608"]
"src/cli_consumption/adapters/kilo.py" = ["S608"]
"src/cli_consumption/adapters/opencode.py" = ["S608"]
"src/cli_consumption/adapters/registry.py" = ["S105", "S106"]
"src/cli_consumption/api.py" = ["S608"]
"src/cli_consumption/cli.py" = ["S107"]
"src/cli_consumption/dashboard.py" = ["E501", "S608"]
"tests/**" = ["S101"]
"tests/smoke_minimal_install.py" = ["S603", "S607"]
"tests/test_codex_adapter.py" = ["S608"]
"tests/test_dashboard_calculations.py" = ["S607"]
"tests/test_demo.py" = ["S603"]
"tests/test_packaging.py" = ["S603", "S607"]
