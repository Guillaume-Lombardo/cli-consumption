[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-consumption"
version = "0.0.3"
description = "Analyze and consolidate AI coding CLI consumption across machines."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Guillaume Lombardo", email = "lombardo.guillaume@gmail.com" }]
keywords = ["ai", "cli", "codex", "observability", "tokens", "usage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/Guillaume-Lombardo/cli-consumption"
Documentation = "https://github.com/Guillaume-Lombardo/cli-consumption#readme"
Issues = "https://github.com/Guillaume-Lombardo/cli-consumption/issues"
Repository = "https://github.com/Guillaume-Lombardo/cli-consumption.git"

[project.scripts]
cli-consumption = "cli_consumption.cli:app"

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "ty>=0.0.74",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_consumption"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cli_consumption"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/cli_consumption/dashboard.py" = ["E501"]
